
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS - Learning Management System</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <h1>Learning Management System</h1>
    <p>Learn something new every day</p>
  </header>

  <main class="container">
    <h2>Available Courses</h2>
    <label for="course-search">Search courses</label>
    <input id="course-search" type="search"
           placeholder="Search by course name">

    <p id="course-count" aria-live="polite"></p>
    <section id="course-list" class="course-list"
             aria-label="Available courses"></section>
  </main>

  <footer>
    <p>LMS Branching Project</p>
  </footer>g
</body>
</html>
